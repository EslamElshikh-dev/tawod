name: tawod-db-acceptance
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_PASSWORD: isolated-acceptance-db-only
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:19999:9999"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:19999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:isolated-acceptance-db-only@db:5432/postgres?search_path=auth
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: isolated-acceptance-jwt-only-never-production-69
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
  rest:
    image: postgrest/postgrest:v14.18
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:13000:3000"]
    environment:
      PGRST_DB_URI: postgres://authenticator:isolated-acceptance-rest-only@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: isolated-acceptance-jwt-only-never-production-69
