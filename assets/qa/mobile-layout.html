></div><div class=\"health-copy\"><span class=\"micro-label\">مؤشر الإحالات التقديري</span><h3 id=\"healthLabel\">جاري التحليل</h3><p id=\"healthText\">يظهر الحكم بعد تحميل البيانات.</p><div class=\"confidence-row\"><span>حجم العينة</span><b id=\"confidenceLabel\">—</b></div></div></article>\n      <div class=\"kpi-grid\" id=\"summaryExtraMetrics\"></div>\n      <div class=\"secondary-strip\">\n        <div><span>مشاهدات الصفحات</span><strong id=\"secondaryViews\">—</strong></div><div><span>الزوار الفريدون</span><strong id=\"secondaryVisitors\">—</strong></div><div><span title=\"زائر ظهر في جلسة واحدة خلال الفترة\">زوار بجلسة واحدة</span><strong id=\"secondaryNewVisitors\">—</strong></div><div><span title=\"زائر ظهر في أكثر من جلسة خلال الفترة\">زوار متكررون</span><strong id=\"secondaryReturningVisitors\">—</strong></div><div><span>ضغطات الاتصال الخام</span><strong id=\"secondaryCalls\">—</strong></div><div><span>ضغطات واتساب الخام</span><strong id=\"secondaryWhatsapp\">—</strong></div><div><span>ضغطات مكررة/مشتركة</span><strong id=\"secondaryDuplicates\">—</strong></div><div><span>مشاهدات المقالات</span><strong id=\"secondaryArticles\">—</strong></div>\n      </div>\n      <div class=\"definition-strip\" id=\"definitionStrip\"></div>\n      <div class=\"source-quality-grid compact-top\" id=\"sourceQualityGrid\" aria-label=\"اكتمال البيانات وحالة المصادر\"></div>\n      </details>\n    </section>\n\n    <section class=\"admin-section\" id=\"followups\">\n      <div class=\"section-heading\"><div><p class=\"eyebrow\">TODAY'S WORKSPACE</p><h2>مركز المتابعات والفرص المعلّقة</h2></div><p>كل الفرص المفتوحة عبر جميع التواريخ · المواعيد بتوقيت الرياض.</p></div>\n      <div class=\"followup-metrics\" id=\"followupMetrics\" aria-live=\"polite\"></div>\n      <article class=\"panel followup-panel compact-top\">\n        <div class=\"workspace-toolbar\">\n          <label><span>عرض المتابعات</span><select id=\"followupFilter\"><option value=\"all\">كل الفرص المفتوحة</option><option value=\"overdue\">متأخرة</option><option value=\"today\">مستحقة اليوم</option><option value=\"unassigned\">دون مسؤول</option><option value=\"unscheduled\">دون موعد</option><option value=\"stale\">دون تواصل منذ 7 أيام</option><option value=\"unqualified\">تحتاج تأهيلًا</option></select></label>\n          <label class=\"workspace-search\"><span>بحث في الفرص</span><input id=\"followupSearch\" type=\"search\" maxlength=\"160\" placeholder=\"الخدمة، المسؤول، الحملة أو معرف الفرصة\"></label>\n          <span id=\"followupCount\">—</span>\n        </div>\n        <p class=\"workspace-notice\" id=\"followupLimit\" hidden>يعرض المركز أول 500 فرصة حسب موعد المتابعة؛ الأعداد والقيم تشمل كل الفرص.</p>\n        <div class=\"followup-list\" id=\"followupList\"></div>\n      </article>\n    </section>\n\n    <section class=\"admin-section\" id=\"funnel\">\n      <div class=\"section-heading\"><div><p class=\"eyebrow\">REFERRAL & QUALIFICATION</p><h2>من الزيارة إلى الفرصة والعقد</h2></div><p>الإحالة من الموقع؛ التأهيل من مراجعة الفريق. أعداد المبيعات تخص الفرص المسجلة التي بدأت في الفترة.</p></div>\n      <div class=\"funnel-board panel\" id=\"funnelGrid\"></div>\n      <div class=\"qualification-grid\" id=\"qualificationMetrics\"></div>\n      <div class=\"two-column compact-top\"><article class=\"panel\"><div class=\"panel-title\"><div><span class=\"micro-label\">قنوات الإحالة</span><h3>اتصال أم واتساب؟</h3></div></div><div id=\"channelSplit\" class=\"channel-list\"></div></article><article class=\"panel\"><div class=\"panel-title\"><div><span class=\"micro-label\">وضوح القياس</span><h3>كيف تُحسب الأرقام؟</h3></div></div><div id=\"reconciliationBox\" class=\"reconciliation-box\"></div></article></div>\n    </section>\n\n    <section class=\"admin-section\" id=\"customers\">\n      <div class=\"section-heading\"><div><p class=\"eyebrow\">CUSTOMER WORKSPACE</p><h2>كل علاقة في ملف واحد</h2><p>التواصل، الفرص، العقود، والخطوة القادمة للعميل.</p></div><button id=\"customerNew\" type=\"button\">إضافة عميل</button></div>\n      <article class=\"panel\"><div class=\"workspace-toolbar\"><label class=\"customer-search\"><span>ابحث عن عميل</span><input id=\"customerSearch\" type=\"search\" maxlength=\"100\" placeholder=\"الاسم أو الهاتف أو الشركة\"></label><label><span>الحالة</span><select id=\"customerStatus\"><option value=\"active\">نشطون</option><option value=\"inactive\">مؤرشفون</option><option value=\"\">الكل</option></select></label><span id=\"customerCount\"></span></div><p id=\"customerError\" class=\"form-error\" role=\"alert\"></p><div id=\"customerList\" class=\"customer-list\" aria-live=\"polite\"></div><div class=\"customer-pagination\"><button id=\"customerPrevious\" type=\"button\" class=\"button-secondary\">السابق</button><span id=\"customerPage\"></span><button id=\"customerNext\" type=\"button\" class=\"button-secondary\">التالي</button></div></article>\n    </section>\n    <section class=\"admin-section\" id=\"sales-pipeline\">\n      <div class=\"section-heading\"><div><p class=\"eyebrow\">SALES & CONTRACTS</p><h2>متابعة العروض والعقود</h2></div><p>مرحلة تجارية واحدة لكل فرصة؛ تُحدّث يدويًا بعد مراجعة الاتصال أو محادثة واتساب.</p></div>\n      <div class=\"pipeline-kpi-grid\" id=\"pipelineSummaryMetrics\"></div>\n      <article class=\"panel stage-board-panel compact-top\"><div class=\"panel-title\"><div><span class=\"micro-label\">PIPELINE AT A GLANCE</span><h3>الفرص أمامك، مرحلة بمرحلة</h3></div><label class=\"board-scope\"><span>نطاق العرض</span><select id=\"boardScope\"><option value=\"open\">كل الفرص المفتوحة</option><option value=\"period\">فرص فترة التقرير · كل المراحل</option></select></label></div><p class=\"workspace-notice\">القيم تقديرية للفرص المفتوحة، ومسجلة للعقود. عمر المرحلة يبدأ من وقت اعتمادها في اللوحة؛ التواريخ القديمة غير المعروفة تظهر بوضوح.</p><div id=\"salesStageBoard\" class=\"sales-stage-board\"></div></article>\n      <div class=\"pipeline-create-row\"><button id=\"pipelineNewButton\" type=\"button\" data-icon=\"plus\">إضافة فرصة جديدة</button></div>\n      <article class=\"panel pipeline-entry-panel compact-top\" id=\"opportunity-editor\" hidden>\n        <div class=\"panel-title\"><div><span class=\"micro-label\">ADD SALES OUTCOME</span><h3>إضافة فرصة أو تحديث نتيجتها</h3></div><span>بيانات التواصل داخل ملف العميل المرتبط</span></div>\n        <form id=\"pipelineForm\" class=\"pipeline-form\" autocomplete=\"off\">\n          <input id=\"pipelineId\" type=\"hidden\">\n          <div class=\"pipeline-customer-binding\"><div><span>ملف العميل</span><strong id=\"pipelineCustomerName\">سجّل الفرصة أولًا لربطها بعميل</strong></div><button id=\"pipelineCustomerChoose\" type=\"button\" class=\"button-secondary\" hidden>ربط بملف عميل</button><button id=\"pipelineCustomerView\" type=\"button\" class=\"button-ghost\" hidden>فتح الملف</button><button id=\"pipelineCustomerUnlink\" type=\"button\" class=\"button-ghost\" hidden>إزالة الربط</button></div><div class=\"pipeline-source-binding\" id=\"pipelineSourceBinding\">فرصة يدوية · المصدر غير مرتبط بإحالة مقاسة</div>\n          <label><span>القناة</span><select id=\"pipelineSourceType\" required><option value=\"whatsapp\">واتساب</option><option value=\"call\">اتصال</option><option value=\"form\">نموذج</option><option value=\"other\">أخرى</option></select></label>\n          <label><span>المرحلة</span><select id=\"pipelineStage\" required><option value=\"new\">إحالة جديدة</option><option value=\"qualified\">عميل مؤهل</option><option value=\"quote_sent\">عرض سعر مرسل</option><option value=\"site_visit\">زيارة موقع</option><option value=\"contract_signed\">عقد موقّع</option><option value=\"lost\">لم يتم التعاقد</option></select></label>\n          <label><span>الخدمة</span><input id=\"pipelineServiceType\" type=\"text\" maxlength=\"160\" placeholder=\"مثال: بناء عظم\"></label>\n          <label><span>الحملة</span><input id=\"pipelineCampaign\" type=\"text\" maxlength=\"180\" placeholder=\"اسم الحملة إن وُجد\"></label>\n          <label><span>المنطقة / المدينة</span><input id=\"pipelineLocation\" type=\"text\" maxlength=\"120\" placeholder=\"مثال: الرياض · حي النرجس\"></label>\n          <label><span>موعد التنفيذ المتوقع</span><select id=\"pipelineTiming\"><option value=\"unknown\">غير محدد</option><option value=\"immediate\">جاهز للبدء</option><option value=\"1_3_months\">خلال 1–3 أشهر</option><option value=\"3_6_months\">خلال 3–6 أشهر</option><option value=\"later\">لاحقًا</option></select></label>\n          <label><span>ملاءمة الخدمة</span><select id=\"pipelineFit\"><option value=\"unknown\">تحتاج مراجعة</option><option value=\"suitable\">مناسبة لخدماتنا</option><option value=\"unsuitable\">خارج نطاق خدماتنا</option></select></label>\n          <label><span>نتيجة التواصل الفعلي</span><select id=\"pipelineContactResult\"><option value=\"not_contacted\">لم يُراجع التواصل</option><option value=\"no_response\">لم يتم الرد</option><option value=\"contacted\">تم التواصل والمراجعة</option><option value=\"invalid\">طلب غير صالح</option></select></label>\n          <label><span>مسؤول المتابعة (عضو الفريق)</span><input id=\"pipelineAssignee\" type=\"text\" maxlength=\"80\" placeholder=\"اسم أو رمز المسؤول الداخلي\"></label>\n          <label><span>المتابعة القادمة · توقيت الرياض</span><input id=\"pipelineFollowupAt\" type=\"datetime-local\"></label>\n          <label><span>آخر تواصل فعلي · توقيت الرياض</span><input id=\"pipelineLastContactAt\" type=\"datetime-local\"></label>\n          <label><span>الإجراء القادم</span><input id=\"pipelineNextAction\" type=\"text\" maxlength=\"160\" placeholder=\"مثال: مراجعة العرض مع فريق التنفيذ\"></label>\n          <label id=\"pipelineLostReasonLabel\" hidden><span>سبب عدم التعاقد</span><select id=\"pipelineLostReason\"><option value=\"\">اختر السبب</option><option value=\"price\">السعر</option><option value=\"timing\">تأجيل المشروع</option><option value=\"outside_scope\">خارج نطاق الخدمة</option><option value=\"no_response\">انقطاع الرد</option><option value=\"competitor\">التعاقد مع منافس</option><option value=\"other\">سبب آخر موضح بالملاحظة</option></select></label>\n          <label><span>قيمة متوقعة (ر.س)</span><input id=\"pipelineEstimatedValue\" type=\"number\" min=\"0\" max=\"999999999\" step=\"0.01\" inputmode=\"decimal\" value=\"0\"></label>\n          <label><span>قيمة العقد (ر.س)</span><input id=\"pipelineContractValue\" type=\"number\" min=\"0\" max=\"999999999\" step=\"0.01\" inputmode=\"decimal\" value=\"0\"></label>\n          <label class=\"pipeline-notes\"><span>ملاحظة تشغيلية قصيرة</span><input id=\"pipelineNotes\" type=\"text\" maxlength=\"500\" placeholder=\"مثال: أُرسل العرض وينتظر اعتماد المخططات\"></label>\n          <p class=\"pipeline-guidance\">التأهيل يتطلب خدمة مناسبة وتواصلًا مُراجعًا. الفرصة المؤهلة المفتوحة تحتاج مسؤولًا وإجراءً وموعد متابعة. لا تُحتسب نقرة التواصل مراجعةً فعلية.</p>\n          <p id=\"pipelineError\" class=\"form-error\" role=\"alert\"></p>\n          <div class=\"pipeline-form-actions\"><button id=\"pipelineSaveButton\" type=\"submit\">حفظ في مسار البيع</button><button id=\"pipelineReloadButton\" class=\"button-secondary\" type=\"button\" hidden>تحميل النسخة الأحدث</button><button id=\"pipelineCancelButton\" class=\"button-ghost\" type=\"button\" hidden>إلغاء التعديل</button></div>\n        </form>\n        <div class=\"pipeline-history\" id=\"pipelineHistory\" hidden><h4>سجل التغييرات</h4><p>السجل يبدأ من تفعيل نظام المتابعة؛ المراحل السابقة لا تحمل تواريخ مفترضة.</p><ol id=\"pipelineHistoryList\"></ol></div>\n      </article>\n      <article class=\"panel table-panel compact-top\"><div class=\"table-header\"><div><span class=\"micro-label\">SALES COHORT</span><h3>الفرص التي بدأت في فترة التقرير</h3></div><span id=\"pipelineLastUpdate\">—</span></div><div class=\"workspace-toolbar\"><label><span>المرحلة</span><select id=\"pipelineStageFilter\"><option value=\"all\">كل المراحل</option><option value=\"new\">إحالة جديدة</option><option value=\"qualified\">عميل مؤهل</option><option value=\"quote_sent\">عرض مرسل</option><option value=\"site_visit\">زيارة موقع</option><option value=\"contract_signed\">عقد موقّع</option><option value=\"lost\">لم يتم التعاقد</option></select></label><button id=\"pipelineExportButton\" class=\"button-secondary\" type=\"button\">تصدير الفرص CSV</button></div><p class=\"workspace-notice\" id=\"pipelineLimit\" hidden>عرض أول 500 فرصة في الفترة؛ مؤشرات المسار تشمل جميع الفرص.</p><div class=\"table-wrap\"><table><thead><tr><th>الفرصة / التاريخ</th><th>القناة / المصدر</th><th>الخدمة / المنطقة</th><th>الحملة</th><th>المرحلة</th><th>المسؤول / المتابعة</th><th>Google Sheets</th><th>متوقع</th><th>قيمة العقد</th><th>تعديل</th></tr></thead><tbody id=\"pipelineBody\"></tbody></table></div><div class=\"table-empty\" id=\"pipelineEmpty\" hidden>لا توجد فرص مطابقة. الفرص المفتوحة القديمة تظهر في مركز المتابعات.</div></article>\n    </section>\n\n    <section class=\"admin-section\" id=\"commercial\">\n      <div class=\"section-heading\"><div><p class=\"eyebrow\">FROM SOURCE TO CONTRACT</p><h2>المصادر التي تتحول إلى أعمال</h2></div><p>نتائج تجارية من سجل الفرص، مع فصل تاريخ الإحالة عن تاريخ اعتماد النتيجة.</p></div>\n      <div class=\"commercial-kpi-grid\" id=\"commercialActivityMetrics\"></div>\n      <p class=\"workspace-notice\" id=\"commercialWindowNote\"></p>\n      <article class=\"panel table-panel compact-top\"><div class=\"table-header\"><div><span class=\"micro-label\">REFERRAL COHORT · CURRENT OUTCOMES</span><h3>نتيجة الفرص التي بدأت في فترة التقرير</h3></div></div><div class=\"workspace-toolbar\"><label><span>التجميع حسب</span><select id=\"commercialGroup\"><option value=\"source\">مصدر الاكتساب</option><option value=\"campaign\">المصدر والحملة</option></select></label><button type=\"button\" id=\"commercialExportButton\" class=\"button-secondary\">تصدير النتائج CSV</button></div><p class=\"workspace-notice\">المصدر هو إحالة التواصل المرتبطة بالفرصة، وليس نموذج إسناد متعدد اللمسات. «غير مرتبط» يشمل الفرص اليدوية. قيمة العقد ليست إيرادًا محصلًا أو ربحًا.</p><p class=\"workspace-notice\" id=\"commercialGroupLimit\" hidden>عرض أكبر 100 مجموعة حملة؛ مؤشرات النتائج والمراحل تشمل جميع الفرص.</p><div class=\"table-wrap\"><table><thead><tr><th id=\"commercialGroupHeading\">المصدر</th><th>فرص</th><th>سبق تأهيلها</th><th>مفتوحة</th><th>عقود</th><th>لم يتم التعاقد</th><th>عقود ÷ فرص</th><th>قيمة العقود</th><th>قيمة مفتوحة تقديرية</th></tr></thead><tbody id=\"commercialSourceBody\"></tbody></table></div><div class=\"table-empty\" id=\"commercialSourceEmpty\">لا توجد فرص فعلية في هذه الفترة.</div></article>\n      <div class=\"two-column compact-top\"><article class=\"panel commercial-detail\"><div class=\"panel-title\"><div><span class=\"micro-label\">LEARN FROM LOST OPPORTUNITIES</span><h3>أسباب عدم التعاقد</h3></div></div><div id=\"commercialLossReasons\" class=\"loss-reason-list\"></div><p class=\"workspace-notice\">الحالة الحالية لفرص الفترة. تسجيل السبب يساعد الفريق على اختيار تحسين محدد.</p></article><article class=\"panel commercial-detail\"><div class=\"panel-title\"><div><span class=\"micro-label\">READ BEFORE YOU DECIDE</span><h3>كيف تستخدم النتائج؟</h3></div></div><ol class=\"commercial-reading\"><li>قارن عدد الفرص المؤهلة والعقود مع حجم العينة لكل مصدر.</li><li>راجع الفرص المفتوحة قبل الحكم على مصادر لم تكمل دورة البيع.</li><li>سجّل تحسينًا في مركز القرارات، وحدد مسؤولًا وموعدًا لمراجعته.</li></ol><a class=\"commercial-decision-link\" href=\"#decisions\">انتقل من النتيجة إلى إجراء ←</a></article></div>\n    </section>\n\n    <section class=\"admin-section\" id=\"trend\">\n      <div class=\"section-heading\"><div><p class=\"eyebrow\">TREND & MOMENTUM</p><h2>اتجاه الزيارات والإحالات</h2></div><p>آخر 7 أيام مقارنة بالأسبوع السابق.</p></div>\n      <div class=\"comparison-grid\" id=\"comparisonMetrics\"></div>\n      <article class=\"panel chart-panel\"><div class=\"panel-title\"><div><span class=\"micro-label\">DAILY PERFORMANCE</span><h3>زيارات · اتصال · واتساب · إحالات</h3></div><div class=\"legend\"><span><i class=\"legend-views\"></i>زيارات</span><span><i class=\"legend-contacts\"></i>إحالات</span></div></div><div class=\"daily-chart\" id=\"dailyChart\" aria-label=\"اتجاه الأداء اليومي\"></div></article>\n    </section>\n\n    <section class=\"admin-section\" id=\"google-ads\">\n      <div class=\"section-heading\"><div><p class=\"eyebrow\">GOOGLE ADS</p><h2>الميزانية والصرف وجودة المكالمات</h2></div><p>لا تظهر الأرقام كصفر عندما يكون المصدر غير متصل.</p></div>\n      <div class=\"ads-status-bar\"><div class=\"ads-status-copy\"><span class=\"ads-status-chip\" id=\"googleAdsStatus\"><i></i> فحص الاتصال</span><div><strong>مصدر Google Ads</strong><span id=\"googleAdsLastSync\">—</span></div></div><div class=\"ads-sync-actions\"><button id=\"googleAdsSyncButton\" class=\"ads-sync-button\" type=\"button\">تحديث Google Ads</button><small id=\"googleAdsSyncFeedback\">المشغّل التلقائي يعمل كل ساعة</small><span class=\"source-badge\">المصدر: Google Ads API</span></div></div>\n      <div class=\"source-setup\" id=\"googleAdsConnectHint\"><strong>يلزم تشغيل مزامنة Google Ads</strong><p>بعد الربط تظهر الميزانية اليومية، الصرف، الحملات، التحويلات، ومدة المكالمات الفعلية. لا يتم اختراع قيم بديلة.</p></div>\n      <div class=\"ads-kpi-grid compact-top\" id=\"adsSummaryMetrics\"></div>\n      <div class=\"budget-panel panel compact-top\" id=\"budgetPanel\"></div>\n      <div class=\"ads-grid compact-top\"><article class=\"panel\"><div class=\"panel-title\"><div><span class=\"micro-label\">DAILY SPEND</span><h3>النقرات · الإنفاق · التحويلات</h3></div></div><div class=\"ads-chart\" id=\"adsDailyChart\"></div></article><article class=\"panel\"><div class=\"panel-title\"><div><span class=\"micro-label\">OPTIMIZATION</span><h3>تحسينات Google Ads</h3></div></div><div class=\"ads-actions\" id=\"adsRecommendations\"></div></article></div>\n      <article class=\"panel table-panel compact-top\"><div class=\"table-header\"><div><span class=\"micro-label\">CAMPAIGNS</span><h3>الحملات حسب الميزانية والقيمة</h3></div></div><div class=\"table-wrap\"><table><thead><tr><th>الحملة</th><th>الحالة</th><th>الميزانية/يوم</th><th>الصرف</th><th>النقرات</th><th>CTR</th><th>إحالات الموقع</th><th>عميل محتمل</th><th>عميل مؤكد</th><th>CPA</th></tr></thead><tbody id=\"adsCampaignsBody\"></tbody></table></div><div class=\"table-empty\" id=\"adsCampaignsEmpty\" hidden>لا توجد بيانات حملات متصلة.</div></article>\n      <article class=\"panel compact-top\"><div class=\"panel-title\"><div><span class=\"micro-label\">CONVERSION ACTIONS</span><h3>أحداث التحويل داخل Google Ads</h3></div><span id=\"adsConversionGoalHealth\">فحص إعداد الأهداف</span></div><div class=\"ads-action-list\" id=\"adsConversionActions\"></div></article>\n    </section>\n\n    <section class=\"admin-section\" id=\"business-profile\">\n      <div class=\"section-heading\"><div><p class=\"eyebrow\">GOOGLE BUSINESS PROFILE</p><h2>أداء الملف التجاري للشركة</h2></div><p>ملف الرياض · الظهور وضغطات التواصل من Google.</p></div>\n      <div class=\"ads-status-bar\"><div class=\"ads-status-copy\"><span class=\"ads-status-chip\" id=\"businessProfileStatus\"><i></i> فحص الاتصال</span><div><strong id=\"businessProfileName\">الملف التجاري</strong><span id=\"businessProfileLastSync\">—</span></div></div><span class=\"source-badge\">Google Business Profile · Windsor</span></div>\n      <div id=\"profileCoverageNote\" class=\"profile-source-note\" hidden></div>\n      <div class=\"source-setup\" id=\"businessProfileConnectHint\"><strong>بيانات الملف التجاري غير متاحة حاليًا</strong><p>تظهر الأرقام بعد وصول بيانات Google؛ لا تُستبدل البيانات المفقودة بأصفار.</p></div>\n      <div class=\"profile-kpi-grid compact-top\" id=\"profileSummaryMetrics\"></div>\n      <div class=\"two-column compact-top\"><article class=\"panel\"><div class=\"panel-title\"><div><span class=\"micro-label\">PROFILE TREND</span><h3>الظهور والإجراءات يوميًا</h3></div></div><div class=\"profile-chart\" id=\"profileDailyChart\"></div></article><article class=\"panel\"><div class=\"panel-title\"><div><span class=\"micro-label\">SEARCH KEYWORDS</span><h3>كيف يجد العملاء الشركة؟</h3></div></div><div class=\"keyword-list\" id=\"profileKeywords\"></div></article></div>\n    </section>\n\n    <section class=\"admin-section\" id=\"social\">\n      <div class=\"section-heading\"><div><p class=\"eyebrow\">SOCIAL PERFORMANCE</p><h2>من الانتباه إلى فرصة بيع</h2></div><p>أداء المنصات ونتيجتها على موقع تعاود، بمصادر قياس واضحة.</p></div>\n      <div class=\"social-intro\"><div><span class=\"micro-label\">FOUR CHANNELS · ONE CLEAR VIEW</span><p>كل منصة لها قصتها.<br><strong>والنتيجة تُقاس بالدليل.</strong></p></div><div class=\"social-intro-note\"><svg class=\"cc-icon\" aria-hidden=\"true\"><use href=\"#cc-i-check\"></use></svg><span>زيارات الموقع تُقاس تلقائيًا.<br>أرقام الحساب تأتي من تقارير المنصات.</span></div></div>\n      <div class=\"social-filter\" id=\"socialFilter\" role=\"group\" aria-label=\"تصفية أداء السوشيال\"><button type=\"button\" data-platform=\"all\" class=\"is-active\" aria-pressed=\"true\">كل المنصات</button><button type=\"button\" data-platform=\"tiktok\" aria-pressed=\"false\"><svg class=\"cc-icon\" aria-hidden=\"true\"><use href=\"#cc-i-tiktok\"></use></svg>TikTok</button><button type=\"button\" data-platform=\"instagram\" aria-pressed=\"false\"><svg class=\"cc-icon\" aria-hidden=\"true\"><use href=\"#cc-i-instagram\"></use></svg>Instagram</button><button type=\"button\" data-platform=\"facebook\" aria-pressed=\"false\"><svg class=\"cc-icon\" aria-hidden=\"true\"><use href=\"#cc-i-facebook\"></use></svg>Facebook</button><button type=\"button\" data-platform=\"x\" aria-pressed=\"false\"><svg class=\"cc-icon\" aria-hidden=\"true\"><use href=\"#cc-i-x\"></use></svg>X</button></div>\n      <p id=\"socialWindow\" class=\"workspace-notice\"></p>\n      <div id=\"socialPlatformCards\" class=\"social-platform-grid\" aria-live=\"polite\"></div>\n      <p class=\"workspace-notice social-method-note\">الزيارة = جلسة بدأت بمشاهدة صفحة. الإحالة = جلسة ضغطت اتصال أو واتساب؛ ليست محادثة مؤكدة. التأهيل والعقد من الفرص المسجّلة المرتبطة بإحالات هذه الجلسات. المصدر المثبت هو UTM أو إحالة المتصفح المتاحة؛ بعض التطبيقات لا ترسل مصدرًا.</p>\n      <article class=\"panel social-native-panel\"><div class=\"panel-title\"><div><span class=\"micro-label\">ACCOUNT ANALYTICS · REPORTED BY THE PLATFORM</span><h3>أداء الحساب داخل المنصة</h3></div><span id=\"socialReportStatus\" class=\"social-status\">لا يوجد تقرير</span></div><label class=\"social-report-picker\"><span>الحساب والتقرير</span><select id=\"socialReportSelect\" aria-label=\"الحساب وتقرير المنصة\"></select></label><div id=\"socialNativeMetrics\" class=\"social-native-grid\"></div><div id=\"socialReportContext\" class=\"social-report-context\"></div><details class=\"social-report-details\"><summary>باقي المؤشرات وتعريف مصدرها</summary><div id=\"socialReportDetails\"></div></details><p class=\"workspace-notice\">الفترة أعلاه تخص تقرير الحساب، وقد تختلف عن فترة الموقع. الوصول فريد داخل حساب وفترة محددة؛ لا نجمعه بين الحسابات أو الأيام أو المنصات. المشاهدات والتفاعلات كما يعرّفها مصدر التقرير.</p></article>\n      <details class=\"measurement-details social-campaign-details\"><summary><span data-icon=\"sources\">الحملات والمنشورات التي جلبت زيارات</span><small>UTM campaign / content</small></summary><div class=\"table-wrap\"><table><thead><tr><th>المنصة</th><th>الحملة</th><th>المنشور / المحتوى</th><th>زيارات</th><th>إحالات</th><th>معدل الإحالة</th><th>زيارات مدفوعة</th></tr></thead><tbody id=\"socialCampaignBody\"></tbody></table></div><p id=\"socialCampaignNote\" class=\"workspace-notice\"></p></details>\n      <div class=\"social-tools-grid\">\n        <details class=\"panel social-tool\"><summary><span data-icon=\"copy\">رابط ذكي لكل حملة أو منشور</span><small>قياس المصدر من أول زيارة</small></summary><form id=\"socialLinkForm\" class=\"social-form\"><label>المنصة<select id=\"socialLinkPlatform\"><option value=\"tiktok\">TikTok</option><option value=\"instagram\">Instagram</option><option value=\"facebook\">Facebook</option><option value=\"x\">X</option></select></label><label>نوع الظهور<select id=\"socialLinkMedium\"><option value=\"organic_social\">عضوي</option><option value=\"paid_social\">مدفوع</option></select></label><label class=\"span-two\">رابط صفحة تعاود<input type=\"url\" id=\"socialLinkTarget\" value=\"https://tawodco.com/\" required maxlength=\"700\" dir=\"ltr\"></label><label>رمز الحملة<input id=\"socialLinkCampaign\" placeholder=\"khobar-villas\" pattern=\"[A-Za-z0-9_-]+\" required maxlength=\"80\" dir=\"ltr\"></label><label>رمز المنشور<input id=\"socialLinkContent\" placeholder=\"reel-01\" pattern=\"[A-Za-z0-9_-]+\" maxlength=\"80\" dir=\"ltr\"></label><p class=\"workspace-notice span-two\">استخدم رموزًا للحملة والمنشور. لا تضع أسماء العملاء أو أرقام التواصل في الرابط.</p><button type=\"submit\" class=\"span-two\">إنشاء رابط القياس</button><label class=\"span-two\">الرابط الناتج<textarea id=\"socialLinkOutput\" readonly rows=\"3\" dir=\"ltr\" placeholder=\"سيظهر رابط الحملة هنا\"></textarea></label><button id=\"socialLinkCopy\" type=\"button\" class=\"button-secondary\" disabled>نسخ الرابط</button><a id=\"socialLinkOpen\" class=\"button-secondary\" target=\"_blank\" rel=\"noopener noreferrer\" hidden>معاينة الصفحة</a><p id=\"socialLinkError\" class=\"form-error span-two\" role=\"alert\"></p></form></details>\n        <details class=\"panel social-tool\" id=\"socialImportTool\"><summary><span data-icon=\"pages\">استيراد تقرير أداء الحساب</span><small>معاينة ثم حفظ تقرير فعلي</small></summary><div class=\"social-import-content\"><p class=\"workspace-notice\">حمّل القالب الموحّد وانقل إليه إجمالي الحساب للفترة من تقرير المنصة. لا تضع مجموع الوصول اليومي أو أرقام منشورات تراكمية. الخانة الفارغة تعني غير متاح؛ الصفر يعني صفرًا مسجلًا.</p><div class=\"social-import-actions\"><button type=\"button\" id=\"socialTemplateButton\" class=\"button-secondary\">تحميل قالب CSV</button><label class=\"social-file-button\">اختر ملف CSV<input type=\"file\" id=\"socialImportFile\" accept=\".csv,text/csv\"></label></div><p class=\"workspace-notice\">حقول إلزامية: platform, account_id, period_start, period_end, scope, time_zone, source_name, observed_at, aggregation=account_period. اكتب التاريخ YYYY-MM-DD، ووقت استخراج التقرير بصيغة ISO مع المنطقة الزمنية. حد أقصى 200 تقرير / 1 MB.</p><div id=\"socialImportPreview\" class=\"social-import-preview\" hidden></div><label class=\"social-confirm\"><input id=\"socialImportConfirm\" type=\"checkbox\"> راجعت الحساب والفترة والمصدر؛ الأرقام إجمالي الحساب للفترة المحددة.</label><button type=\"button\" id=\"socialImportSave\" disabled>حفظ التقارير</button><p id=\"socialImportFeedback\" class=\"form-error\" role=\"status\" aria-live=\"polite\"></p></div></details>\n      </div>\n      <details class=\"measurement-details social-connect-details\"><summary><span data-icon=\"social\">ربط الحسابات وبياناتها</span><small>صلاحيات المنصة ومصدر التقرير</small></summary><p class=\"workspace-notice\">منح الصلاحيات عبر Windsor هو خطوة الربط الأولى. بعد توصيل الحساب، يلزم إعداد نقل تقارير الحساب إلى اللوحة عبر المسار المحمي. فتح صفحة الربط وحده لا يعني وصول البيانات؛ تعرض اللوحة التقارير التي وصلت فعليًا فقط.</p><div class=\"social-connect-grid\"><a href=\"https://onboard.windsor.ai/connect?connector=tiktok_organic&amp;next=/tiktok_organic/authorize\" target=\"_blank\" rel=\"noopener noreferrer\" data-icon=\"tiktok\">ربط TikTok<span>تفويض الحساب</span></a><a href=\"https://onboard.windsor.ai/connect?connector=instagram&amp;next=/instagram/authorize\" target=\"_blank\" rel=\"noopener noreferrer\" data-icon=\"instagram\">ربط Instagram<span>حساب احترافي</span></a><a href=\"https://onboard.windsor.ai/connect?connector=facebook_organic&amp;next=/facebook_organic/authorize\" target=\"_blank\" rel=\"noopener noreferrer\" data-icon=\"facebook\">ربط Facebook<span>صلاحيات الصفحة</span></a><a href=\"https://onboard.windsor.ai/connect?connector=x_organic&amp;next=/app/x_organic\" target=\"_blank\" rel=\"noopener noreferrer\" data-icon=\"x\">ربط X<span>إعداد مفاتيح الحساب</span></a></div><p class=\"workspace-notice\">أدخل بيانات التفويض في صفحة الموصل فقط. لا تُحفظ المفاتيح أو كلمات المرور في المتصفح أو تقرير CSV.</p></details>\n    </section>\n    <section class=\"admin-section\" id=\"measurement\">\n      <div class=\"section-heading\"><div><p class=\"eyebrow\">MEASUREMENT INTEGRITY</p><h2>أرقام يمكن مراجعتها</h2></div><p>فحص الإجماليات وحدود الإسناد في نفس فترة الموقع.</p></div>\n      <div id=\"measurementHero\" class=\"measurement-hero\" aria-live=\"polite\"></div>\n      <div id=\"measurementChecks\" class=\"measurement-check-grid\"></div>\n      <article class=\"panel measurement-diagnostics\"><div class=\"panel-title\"><div><span class=\"micro-label\">EVIDENCE & COVERAGE</span><h3>اكتمال المصدر وجودة التسجيل</h3></div></div><div id=\"measurementDiagnostics\" class=\"measurement-diagnostic-list\"></div></article>\n      <details class=\"measurement-details\"><summary><span data-icon=\"check\">تعريفات القياس وحدود المقارنة</span><small>اقرأ الرقم في سياقه</small></summary><div class=\"measurement-definitions\"><p><strong>نفس الجلسة، مرة واحدة.</strong> نقرات اتصال وواتساب في جلسة واحدة تُحسب إحالة واحدة. لا تجمع إحالات الاتصال مع واتساب للوصول إلى الإجمالي.</p><p><strong>اليوم حسب بداية الجلسة.</strong> الرسم اليومي يُسند مشاهدات وإحالات الجلسة إلى يوم بدايتها بتوقيت الرياض؛ لذلك يتطابق مجموع الأيام مع فترة التقرير، حتى عند عبور منتصف الليل.</p><p><strong>المصدر مع بداية الجلسة.</strong> دخول بحملة جديدة يبدأ جلسة قياس جديدة. تعارض رابط سوشيال موسوم مع معرّف إعلان جوجل يُعرض للمراجعة، دون افتراض مصدره.</p><p><strong>جديد ومتكرر لهما تعريفان.</strong> الزائر الجديد: أول ظهور مسجل له خلال الفترة. الزائر بجلسة واحدة: ظهر في جلسة واحدة خلال الفترة، وقد يكون زار الموقع سابقًا. هوية الزائر مرتبطة بالمتصفح وليست شخصًا مؤكدًا.</p><p><strong>بيانات الحساب مستقلة.</strong> المشاهدات والوصول والمتابعون من تقرير حساب المنصة، وليست زيارات الموقع. لا يُحسب عائد الإعلانات أو تكلفة العميل المؤهل من أرقام غير مرتبطة ببعضها.</p></div></details>\n    </section>\n\n    <section class=\"admin-section\" id=\"acquisition\">\n      <div class=\"section-heading\"><div><p class=\"eyebrow\">ACQUISITION</p><h2>مصدر الزيارات والإحالات</h2></div><p>مصدر واحد لكل جلسة؛ الروابط الداخلية لا تُحتسب كإحالة خارجية.</p></div>\n      <div class=\"two-column acquisition-grid\"><article class=\"panel\"><div class=\"panel-title\"><div><span class=\"micro-label\">المصادر</span><h3>الزيارات وجودة الإحالة</h3></div></div><div class=\"source-list\" id=\"sourcesList\"></div></article><article class=\"panel device-panel\"><div class=\"panel-title\"><div><span class=\"micro-label\">الأجهزة</span><h3>توزيع الجلسات</h3></div></div><div class=\"device-layout\"><div class=\"device-donut\" id=\"deviceDonut\"><strong>—</strong><span>جلسة</span></div><div class=\"device-legend\" id=\"devicesList\"></div></div></article></div>\n      <article class=\"panel table-panel compact-top\"><div class=\"table-header\"><div><span class=\"micro-label\">ATTRIBUTED CAMPAIGNS</span><h3>أداء الحملات داخل الموقع</h3></div></div><div class=\"table-wrap\"><table><thead><tr><th>الحملة</th><th>المصدر</th><th>الزيارات</th><th>اتصال</th><th>واتساب</th><th>الإحالات</th><th>معدل الإحالة</th></tr></thead><tbody id=\"campaignsBody\"></tbody></table></div><div class=\"table-empty\" id=\"campaignsEmpty\" hidden>لا توجد حملات منسوبة في الفترة.</div></article>\n    </section>\n\n    <section class=\"admin-section\" id=\"performance\">\n      <div class=\"section-heading\"><div><p class=\"eyebrow\">CONTENT & DEMAND</p><h2>الصفحات والخدمات الأكثر تأثيرًا</h2></div><p>معدل الإحالة محسوب على جلسات الصفحة لا على الضغطات الخام.</p></div>\n      <div class=\"subsection-heading\"><div><span class=\"micro-label\">FORM DEMAND</span><h3>طلبات النماذج — قياس مساعد منفصل</h3></div></div><div class=\"service-grid\" id=\"servicesGrid\"></div>\n      <article class=\"panel table-panel compact-top\"><div class=\"table-header\"><div><span class=\"micro-label\">LANDING & CONTENT</span><h3>الصفحات الأكثر تأثيرًا</h3></div></div><div class=\"table-wrap\"><table><thead><tr><th>الصفحة</th><th>الزيارات</th><th>المشاهدات</th><th>اتصال</th><th>واتساب</th><th>الإحالات</th><th>المعدل</th><th>الحكم</th></tr></thead><tbody id=\"pagesBody\"></tbody></table></div></article>\n    </section>\n\n    <section class=\"admin-section\" id=\"leads\">\n      <div class=\"section-heading\"><div><p class=\"eyebrow\">REFERRAL LOG</p><h2>آخر الإحالات وجودة المكالمات</h2></div><p>سجل مجهول الهوية لتدقيق المصدر والمرحلة.</p></div>\n      <article class=\"panel table-panel\"><div class=\"table-header\"><div><span class=\"micro-label\">WEBSITE REFERRALS</span><h3>آخر ضغطات الاتصال وواتساب</h3></div></div><div class=\"table-wrap\"><table><thead><tr><th>الوقت</th><th>القناة</th><th>صفحة الإحالة</th><th>المصدر</th><th>الحملة</th><th>الجهاز</th><th>الجلسة</th><th>متابعة</th></tr></thead><tbody id=\"recentLeadsBody\"></tbody></table></div><div class=\"table-empty\" id=\"recentLeadsEmpty\" hidden>لا توجد إحالات في الفترة.</div></article>\n      <article class=\"panel table-panel compact-top\"><div class=\"table-header\"><div><span class=\"micro-label\">CALL QUALIFICATION</span><h3>المكالمات المقاسة والتأهيل</h3></div><span>يمكن اعتماد تكرار التواصل أو طلب الزيارة هنا</span></div><div class=\"call-source-note\" id=\"callSourceNote\"></div><div class=\"table-wrap\"><table><thead><tr><th>الوقت</th><th>الحملة</th><th>المدة</th><th>الحالة</th><th>مرات التواصل</th><th>طلب زيارة</th><th>التصنيف</th><th>حفظ</th></tr></thead><tbody id=\"callsBody\"></tbody></table></div><div class=\"table-empty\" id=\"callsEmpty\" hidden>لم تصل بيانات مدة المكالمات من Google بعد.</div></article>\n    </section>\n\n    <section class=\"admin-section\" id=\"decisions\">\n      <div class=\"section-heading\"><div><p class=\"eyebrow\">DECISION → ACTION → REVIEW</p><h2>مركز القرارات والتنفيذ</h2></div><p>اقتراحات من قواعد واضحة، وإجراءات محفوظة يراجع الفريق نتائجها.</p></div>\n      <div id=\"decisionMetrics\" class=\"commercial-kpi-grid\"></div>\n      <article class=\"panel decision-workspace compact-top\"><div class=\"panel-title\"><div><span class=\"micro-label\">EXECUTION WORKSPACE · ALL DATES</span><h3>ما الذي نعمل عليه؟</h3></div><button id=\"decisionNewButton\" type=\"button\" class=\"button-secondary\">+ إجراء جديد</button></div><div class=\"workspace-toolbar\"><label><span>الحالة</span><select id=\"decisionFilter\"><option value=\"active\">الإجراءات المفتوحة</option><option value=\"overdue\">المتأخرة</option><option value=\"unassigned\">دون مسؤول</option><option value=\"done\">تم التنفيذ</option><option value=\"dismissed\">مستبعدة</option><option value=\"all\">كل الإجراءات</option></select></label><label class=\"workspace-search\"><span>ابحث في العنوان أو المسؤول</span><input type=\"search\" id=\"decisionSearch\" maxlength=\"180\" placeholder=\"عنوان الإجراء أو المسؤول\"></label></div><p id=\"decisionLimit\" class=\"workspace-notice\" hidden>عرض أول 500 إجراء، مع أولوية للإجراءات المفتوحة؛ الأعداد تشمل جميع الإجراءات.</p><div id=\"decisionList\" class=\"execution-list\"></div></article>\n      <article class=\"panel decision-editor compact-top\" id=\"decisionEditor\" hidden><div class=\"panel-title\"><div><span class=\"micro-label\">CLEAR OWNERSHIP · RECORDED RESULT</span><h3 id=\"decisionEditorTitle\">إجراء جديد</h3></div></div><div class=\"decision-evidence\" id=\"decisionEvidence\"></div><form id=\"decisionForm\" class=\"decision-form\" autocomplete=\"off\"><input type=\"hidden\" id=\"decisionId\"><label class=\"decision-wide\"><span>عنوان الإجراء</span><input id=\"decisionTitle\" type=\"text\" maxlength=\"180\" required></label><label class=\"decision-wide\"><span>ما الذي سيتم تنفيذه؟</span><textarea id=\"decisionAction\" maxlength=\"500\" rows=\"3\" required></textarea></label><label><span>الأو function show(doc,id){doc.querySelectorAll('.admin-section').forEach(s=>s.hidden=s.id!==id);doc.querySelector('.header-title h1').textContent=sections.find(s=>s.id===id).title;doc.querySelectorAll('.mobile-bottom-nav a').forEach(a=>a.classList.toggle('is-active',a.hash==='#'+id));}
async function loadFrame(target,width,mode,days){target.style.width=width+'px';await new Promise(resolve=>{target.onload=resolve;target.srcdoc=templates[mode]});await target.contentDocument.fonts.ready;populate(target.contentDocument,days);}
async function preview(){await loadFrame(frame,Number(document.getElementById('width').value),document.getElementById('mode').value,Number(document.getElementById('days').value));show(frame.contentDocument,view.value);}
document.querySelectorAll('header select').forEach(s=>s.onchange=preview);
document.getElementById('audit').onclick=async()=>{
 const button=document.getElementById('audit'),report=document.getElementById('report');button.disabled=true;report.textContent='Running responsive layout audit…';const failures=[],checks=[];const audit=document.createElement('iframe');audit.id='auditFrame';document.body.append(audit);const mode=document.getElementById('mode').value;
 for(const width of [320,360,393,430,768,900,1024,1440])for(const days of [7,30,90]){
  await loadFrame(audit,width,mode,days);
  for(const section of sections){const doc=audit.contentDocument;show(doc,section.id);const rootWidth=doc.documentElement.clientWidth,scroll=doc.documentElement.scrollWidth;const bounds=[...doc.querySelectorAll('.command-header,.admin-section:not([hidden]),.admin-section:not([hidden])>*,.admin-section:not([hidden]) .two-column>*,.admin-section:not([hidden]) .ads-grid>*,.mobile-bottom-nav')].filter(e=>e.getBoundingClientRect().width>0).map(e=>({el:e.id||e.className,left:Math.round(e.getBoundingClientRect().left),right:Math.round(e.getBoundingClientRect().right)})).filter(r=>r.left<-1||r.right>rootWidth+1);const result={width,days,view:section.id,viewport:rootWidth,page:scroll};checks.push(result);if(scroll>rootWidth+1||bounds.length)failures.push({...result,bounds});}
 }
 audit.remove();report.textContent=JSON.stringify({mode,total:checks.length,failures:failures.length,details:failures},null,2);report.dataset.status=failures.length?'failed':'passed';button.disabled=false;
};preview();
