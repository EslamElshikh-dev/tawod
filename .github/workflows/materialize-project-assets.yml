name: Materialize Validated Project Assets

on:
  push:
    branches:
      - feat/google-ads-rescue-2026-08-31

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/google-ads-rescue-2026-08-31
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Rebuild repository-owned project media
        shell: bash
        run: |
          set -euo pipefail

          # Reconstruct and validate the project page/images from the encoded
          # repository sources using the same production prebuild routine.
          node scripts/prepare-next-public.mjs

          # Restore the two project pages to their exact project-media references.
          git checkout origin/main -- \
            project-villa-plaster-ceramic-marble-uhud-riyadh.html \
            project-alrajhi-tanks-king-salman-park.html

          python - <<'PY'
          from pathlib import Path

          topic = Path('scripts/blog-topic-data.mjs')
          text = topic.read_text(encoding='utf-8')
          text = text.replace(
              'projectUrl: "/projects.html",\n    projectLabel: "مشاريع الترميم والتجديد",',
              'projectUrl: "/project-faisaliah-villa-facades-finishing.html",\n    projectLabel: "مشروع واجهات وتشطيبات الفيصلية",'
          )
          topic.write_text(text, encoding='utf-8')

          ignored = {'.git', '.next', 'node_modules', 'out', 'public'}
          for file in Path('.').rglob('*.html'):
              if any(part in ignored for part in file.parts):
                  continue
              html = file.read_text(encoding='utf-8')
              updated = html.replace('modon-eight-warehouses-01.webp', 'modon-eight-warehouses-01-v3.webp')
              updated = updated.replace('modon-eight-warehouses-02.webp', 'modon-eight-warehouses-02-v3.webp')
              if updated != html:
                  file.write_text(updated, encoding='utf-8')
          PY

          # Regenerate article clusters from their source data and synchronize analytics.
          node scripts/run-static-pages.mjs
          node scripts/install-site-analytics.mjs
          node scripts/validate-site.mjs

      - name: Verify full production export
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Commit only durable source/generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u
          git add \
            project-faisaliah-villa-facades-finishing.html \
            images/projects/modon-eight-warehouses-01-v3.webp \
            images/projects/modon-eight-warehouses-02-v3.webp \
            images/projects/alrajhi-tanks-king-salman-park-01.webp \
            images/projects/villa-plaster-ceramic-marble-uhud-riyadh-01.webp

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Materialize validated project pages and media"
          git push origin HEAD:feat/google-ads-rescue-2026-08-31
