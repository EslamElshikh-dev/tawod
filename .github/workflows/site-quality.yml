name: Site Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Next.js export and SEO validation
    # Keep the browser gate on a distribution supported by Playwright 1.55.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Verify isolated database rebuild and permissions
        run: npm run test:database
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/tawod-home.js
          node --check assets/js/tawod-inner.js
          node --check assets/js/tawod-upgrades.js
          node --check scripts/build-home-performance.mjs
          node --check scripts/build-static-pages.mjs
          node --check scripts/run-static-pages.mjs
          node --check scripts/validate-site.mjs
          if [ -f scripts/enhance-contact-page.mjs ]; then node --check scripts/enhance-contact-page.mjs; fi
          if [ -f assets/js/contact-conversion.js ]; then node --check assets/js/contact-conversion.js; fi
      # Check the committed bundle before any generator can refresh it.
      - name: Verify committed homepage performance bundle
        run: npm run check:home
      - name: Prepare site assets
        run: npm run prepare:assets
      - name: Verify interactive villa geometry and renderer fallbacks
        run: npm run test:villa-3d
      - name: Verify maintenance contract journeys and lead classification
        run: npm run test:maintenance-contracts
      - name: Enhance contact conversion flow
        run: |
          if [ -f scripts/enhance-contact-page.mjs ]; then node scripts/enhance-contact-page.mjs; fi
      - name: Generate static HTML
        run: node scripts/run-static-pages.mjs
      - name: Build and verify Next.js static export
        run: npm run build
      - name: Exercise exported service pages and all seven 3D viewers in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/tawod-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/tawod-browser/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/tawod-browser.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          TAWOD_PLAYWRIGHT_MODULE="$RUNNER_TEMP/tawod-browser/node_modules/playwright" node scripts/qa-next-export-browser.mjs
      - name: Validate pages links metadata schema and sitemap
        run: |
          npm run test:site-validation
          node scripts/validate-site.mjs
      - name: Verify contracting content and SEO preservation
        run: npm run check:design
      - name: Detect unresolved merge markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git --exclude-dir=node_modules .; then
            echo 'Unresolved merge markers found.'
            exit 1
          fi
      - name: Reject oversized changed web assets
        run: |
          git diff --name-only --diff-filter=ACMR origin/main...HEAD > /tmp/changed-files.txt
          python3 - <<'PY'
          from pathlib import Path
          limits={'.html':350000,'.css':250000,'.js':350000,'.webp':1200000,'.avif':1200000,'.png':1500000,'.jpg':1500000,'.jpeg':1500000}
          errors=[]
          changed=Path('/tmp/changed-files.txt').read_text().splitlines()
          for name in changed:
              file=Path(name)
              if not file.is_file():
                  continue
              limit=limits.get(file.suffix.lower())
              if limit and file.stat().st_size>limit:
                  errors.append(f'{file}: {file.stat().st_size} bytes exceeds {limit}')
          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          print(f'Asset-size checks passed for {len(changed)} changed files.')
          PY
      - name: Verify generated public content
        run: |
          node scripts/verify-contracting-design.mjs --source-baseline
          node scripts/run-static-pages.mjs --check
          node --test scripts/test-english-parity.mjs
