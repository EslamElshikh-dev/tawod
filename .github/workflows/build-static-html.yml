name: Build Static HTML

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'assets/js/tawod-home.js'
      - 'assets/js/tawod-inner.js'
      - 'assets/js/tawod-upgrades.js'
      - 'assets/css/**'
      - 'app/**'
      - 'lib/**'
      - '**/*.html'
      - 'next.config.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-static-html.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-html-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Verify isolated database rebuild and permissions
        run: npm run test:database
      - name: Check build scripts
        run: |
          node --check assets/js/tawod-home.js
          node --check assets/js/tawod-upgrades.js
          node --check scripts/build-home-performance.mjs
          node --check scripts/build-static-pages.mjs
          node --check scripts/run-static-pages.mjs
          node --check scripts/validate-site.mjs
      # Check the committed bundle before any generator can refresh it.
      - name: Verify homepage performance bundle
        run: npm run check:home
      - name: Generate static page content
        run: node scripts/run-static-pages.mjs
      - name: Verify idempotent generation
        run: node scripts/run-static-pages.mjs --check
      - name: Build and verify Next.js static export
        run: npm run build
      - name: Validate generated site and performance
        run: |
          node scripts/validate-site.mjs
          npm run check:home
          npm run check:mobile-performance
          node scripts/run-static-pages.mjs --check
      - name: Verify generated assets are committed
        run: |
          if ! git diff --exit-code -- '*.html' 'assets/css/tawod-home-performance.css' 'assets/css/tawod-home-critical.css' 'lib/legacy-html-files.ts' 'sitemap*.xml' 'data/sitemap-state.json'; then
            echo "Generated assets are out of date. Run node scripts/run-static-pages.mjs and npm run build, then commit the generated HTML, homepage CSS, route manifest and sitemaps."
            exit 1
          fi
