name: Build Static HTML

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'assets/js/tawod-home.js'
      - 'assets/js/tawod-inner.js'
      - 'assets/js/tawod-upgrades.js'
      - 'assets/css/**'
      - 'app/**'
      - 'lib/**'
      - '**/*.html'
      - 'next.config.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-static-html.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-html-main
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Check build scripts
        run: |
          node --check assets/js/tawod-home.js
          node --check assets/js/tawod-upgrades.js
          node --check scripts/build-home-performance.mjs
          node --check scripts/build-static-pages.mjs
          node --check scripts/run-static-pages.mjs
          node --check scripts/validate-site.mjs
      - name: Verify homepage performance bundle
        run: npm run check:home
      - name: Generate static page content
        run: node scripts/run-static-pages.mjs
      - name: Verify idempotent generation
        run: node scripts/run-static-pages.mjs --check
      - name: Validate generated site
        run: node scripts/validate-site.mjs
      - name: Build and verify Next.js static export
        run: npm run build
      - name: Verify generated HTML is committed
        run: |
          if ! git diff --exit-code -- '*.html' 'blog/**/*.html' 'lp/**/*.html'; then
            echo "Generated HTML is out of date. Run node scripts/run-static-pages.mjs and commit the result."
            exit 1
          fi
